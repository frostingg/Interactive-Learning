<html lang="zh-CN">
<head>

<title>题内问答 · Inline Q&A</title>
<style>
:root{color-scheme:light;--paper:#f7f6f0;--card:#fffefa;--ink:#1c352b;--muted:#66746c;--line:#dddeda;--green:#245c44;--soft:#edf3eb;--cream:#f2ede1;--error:#973e30}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,textarea,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:default;opacity:.55}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #94b29b;outline-offset:3px}[hidden]{display:none!important}
.shell{max-width:940px;margin:0 auto;padding:30px 26px 40px}.masthead{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:22px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-size:16px;font-weight:700;letter-spacing:.03em}.mark{display:grid;place-items:center;width:34px;height:34px;background:var(--ink);color:white;border-radius:10px;font-family:Georgia,serif;font-size:23px}.brand small{display:block;font-size:10px;letter-spacing:.17em;font-weight:500;color:var(--muted);line-height:1.2}.mode-pill{max-width:58%;color:var(--green);background:var(--soft);font-size:11px;border:1px solid #d8e2d5;border-radius:999px;padding:5px 11px;text-align:center}.hero{padding:28px 0 21px}.eyebrow{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--green)}h1{margin:0;font-size:clamp(25px,4vw,36px);line-height:1.4;font-weight:650;letter-spacing:-.04em}.intro{margin:9px 0 0;color:var(--muted);font-size:14px}.notice{background:var(--cream);color:#736346;border-radius:9px;padding:10px 13px;margin-bottom:22px;font-size:12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:13px}.summary{color:var(--muted);font-size:12px;white-space:nowrap}.summary strong{color:var(--ink);font-size:14px;font-weight:650}.search{position:relative;width:240px}.search span{position:absolute;top:7px;left:11px;color:var(--muted)}.search input{width:100%;padding:7px 10px 7px 32px;border:1px solid var(--line);background:var(--card);border-radius:7px;font-size:12px;color:var(--ink)}.directory{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:22px}.directory-label{font-size:11px;color:var(--muted);margin-right:2px}.nav-number{width:30px;height:29px;padding:0;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}.nav-number:hover{color:var(--green);border-color:#9bb49c;background:var(--soft)}.nav-number.has-followups{background:var(--soft);color:var(--green);border-color:#ceddcc}.cards{display:grid;gap:15px}.card{scroll-margin-top:18px;border:1px solid var(--line);border-radius:13px;background:var(--card);overflow:hidden}.card:focus{outline:none}.card:focus-visible{outline:3px solid #a0baa3;outline-offset:3px}.card-head{display:flex;gap:14px;padding:21px 22px 12px;align-items:flex-start}.number{color:#748776;font:22px/1.5 Georgia,serif;min-width:27px}.question{margin:0;flex:1;font-size:17px;font-weight:650;line-height:1.7;word-break:break-word}.toggle{border:0;color:var(--muted);background:transparent;font-size:11px;padding:6px 0 6px 8px;white-space:nowrap}.toggle:hover{color:var(--green)}.card-body{padding:0 22px 19px 63px}.answer{margin:0;font-size:14px;color:#3a4b41;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}.original-label{color:#889288;font-size:10px;letter-spacing:.1em;margin:0 0 5px}.card-actions{display:flex;gap:13px;flex-wrap:wrap;margin-top:14px}.text-button{border:0;background:transparent;padding:0;font-size:12px;color:var(--green);display:flex;align-items:center;gap:5px}.text-button:hover{text-decoration:underline;text-underline-offset:3px}.text-button.secondary{color:var(--muted)}.followups{margin-top:19px;border-left:2px solid #cbdac8;padding-left:16px;display:grid;gap:18px}.followup-tag{display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--green);font-size:10px;letter-spacing:.04em}.demo-answer-tag{background:var(--cream);color:#806c45;padding:1px 5px;border-radius:4px;letter-spacing:0}.followup-question{margin:0 0 7px;color:#4d6557;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.followup-answer{margin:0;color:#344b3e;font-size:14px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}.composer{margin-top:17px;padding:13px;background:#f3f5ef;border:1px solid #dde4d7;border-radius:9px}.composer-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.composer-label{font-size:11px;color:var(--green);font-weight:600}.close-composer{padding:0;color:var(--muted);border:0;background:transparent;font-size:16px;line-height:1}.quote{display:flex;align-items:flex-start;gap:8px;border-left:2px solid #98b299;padding:6px 8px;margin:2px 0 9px;background:#e9eee3;font-size:12px;color:#566a55}.quote-text{flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}.remove-quote{padding:0;border:0;background:transparent;color:var(--muted)}textarea{display:block;width:100%;min-height:71px;resize:vertical;padding:9px 11px;border:1px solid #d8ded2;border-radius:6px;background:var(--card);color:var(--ink);font-size:13px;line-height:1.7}textarea::placeholder{color:#899183}.composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:13px;margin-top:9px}.composer-hint{color:#86907f;font-size:10px}.submit{border:0;background:var(--green);color:#fff;padding:7px 13px;border-radius:6px;font-size:12px;white-space:nowrap}.submit:hover{background:#194b36}.status{margin-top:11px;font-size:12px;color:var(--muted)}.status[data-kind=error]{color:var(--error)}.status[data-kind=pending]::before{content:"";display:inline-block;width:8px;height:8px;border:1px solid #bccdb8;border-top-color:var(--green);border-radius:50%;margin-right:7px;animation:spin .9s linear infinite}.retry{color:var(--error);text-decoration:underline;margin:5px 0 0;border:0;padding:0;background:transparent;font-size:12px}.empty{padding:34px 22px;border:1px dashed #c8d3c6;border-radius:12px;text-align:center;background:var(--card)}.empty h2{margin:0 0 7px;font-size:18px}.empty p{font-size:13px;color:var(--muted);margin:0}.board-error{margin-bottom:15px;font-size:12px;color:var(--error)}.footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-top:24px;color:#899083;font-size:10px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);padding:9px 14px;background:var(--ink);color:white;border-radius:8px;font-size:12px;box-shadow:0 5px 16px #1c352b22;z-index:3}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.status[data-kind=pending]::before{animation:none}}@media(max-width:600px){.shell{padding:20px 15px 28px}.masthead{padding-bottom:17px}.hero{padding:21px 0 18px}.mode-pill{font-size:10px;padding:4px 8px;max-width:52%}.toolbar{align-items:flex-start;flex-direction:column;gap:10px}.search{width:100%}.card-head{padding:17px 16px 10px;gap:10px}.question{font-size:15px}.number{font-size:20px;min-width:23px}.card-body{padding:0 16px 17px}.composer-hint{max-width:58%}.intro{font-size:13px}.directory{gap:6px}}
</style>
</head>
<body data-mode="widget">
<main class="shell">
<header class="masthead"><div class="brand"><span class="mark" aria-hidden="true">Q</span><span>题内问答<small>INLINE Q&A</small></span></div><span class="mode-pill" id="mode-pill">互动题目卡片</span></header>
<section class="hero"><p class="eyebrow">STAY WITH THE QUESTION</p><h1 id="board-title">读到哪里，就问到哪里。</h1><p class="intro">哪一道还不明白，就在那一道里追问。解释和思路，留在原处。</p></section>
<p class="notice" id="notice">选择题目里的文字，再点「引用选中文字」，可以直接询问那一步。</p>
<div id="board-error" class="board-error" role="alert" hidden></div>
<section id="board-section" hidden><div class="toolbar"><div class="summary" id="summary"></div><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索题目" aria-label="搜索题目"></label></div><nav class="directory" id="directory" aria-label="题目目录"><span class="directory-label">跳到题目</span></nav><div class="cards" id="cards"></div><p id="no-matches" class="summary" hidden>没有找到符合搜索的题目。</p></section>
<section class="empty" id="empty"><h2>等待题目卡片</h2><p id="empty-copy">请在 ChatGPT 中调用本插件生成题目卡片；卡片会显示在这里。</p></section>
<footer class="footer"><span>每道题，都有自己的讨论空间。</span><span id="footer-mode">题内追问 · 保留上下文</span></footer>
</main><div class="toast" id="toast" role="status" hidden></div>
<script>
(() => {
'use strict';
const demoMode=document.body.dataset.mode==='demo',$=id=>document.getElementById(id);
const views=new Map(),busy=new Map(),selectedQuotes=new Map(),rpcPending=new Map();
let board=null,rpcId=0,hostOrigin='*',standardReady=false,bridgePromise=null,toastTimer=0,refreshedBoardId=null,lastHeight=0,tornDown=false,hostCapabilities={},resizeObserver=null,resizeFrame=0;
const viewLifetime=new AbortController();
let ui={boardId:null,drafts:{},collapsed:{},composerOpen:{},quotes:{},failed:{},activeRequests:{},filter:''};
const demoLessons=[
['为什么负数乘负数会得到正数？','乘法要与分配律保持一致。因为 0 = (−1) × (1 + (−1))，展开得到 0 = −1 + (−1) × (−1)，所以 (−1) × (−1) = 1。\n关键是：这种规则让已有的加法和乘法规律继续成立。','把它看成补回一次损失：每次少 3 元，记作 −3；撤销两次「少 3 元」，相当于增加 6 元。这个例子帮助直觉理解，分配律则给出严格推导。'],
['分数除法为什么要「乘以倒数」？','除法是在问：一个量里包含多少个另一个量。例如 3 ÷ 1/2 = 6，因为 3 里面有 6 个半。\n一般地，除以 b/a 与乘以 a/b 有相同的效果（a、b 均不为 0）。','用等式检查：设 x = 3 ÷ 1/2，则 x × 1/2 = 3。两边都乘以 2，就得到 x = 6。「倒数」正是把乘法系数消掉的工具。'],
['一元一次方程的「移项」到底做了什么？','移项的本质，是在等式两边做同样的运算。解 2x + 3 = 11 时，两边先减去 3，得到 2x = 8；再同时除以 2，得到 x = 4。\n「移到另一边变号」只是这一步骤的简写。','把等式想成一架平衡的天平。左边拿走 3，右边也要拿走 3，所以 2x + 3 − 3 = 11 − 3。看起来像「+3 移到右边变成 −3」，实际没有东西移动。'],
['为什么三角形的内角和是 180°？','在平面几何中，过三角形一个顶点作一条与对边平行的直线。借助平行线的内错角相等，可把另两个角对应到这条直线上。\n三个角合起来恰好是一个平角，也就是 180°。','先画出三角形 ABC，再过 A 作一条平行于 BC 的直线。角 B 和角 C 分别「复制」到 A 的两侧，它们与角 A 刚好铺满一条直线。这里的前提是平面几何。'],
['勾股定理什么时候可以使用？','只有直角三角形才能直接使用 a² + b² = c²，其中 a、b 是两条直角边，c 是斜边。\n例如直角边长 3 和 4，斜边就是 √(3² + 4²) = 5。先找直角，再判断哪条边是斜边。','判断斜边时看位置：它总是正对直角，也是三条边中最长的一条。如果图中没有直角条件，先不能直接套用勾股定理。'],
['函数的「自变量」和「因变量」怎么区分？','自变量是你先选定或输入的值，因变量是按规则得到的结果。在 y = 2x + 1 中，x 是自变量，y 是因变量。\n当 x = 3 时，y = 7；当 x 改变时，y 按这个规则跟着改变。','可以想成一台计算机器：投入 x，机器先乘以 2，再加 1，输出 y。你改变输入，输出就会随之改变，但输入和输出必须满足同一个规则。'],
['平均数和中位数分别能说明什么？','平均数把总量平均分配，容易受到极端值影响；中位数是排序后处在中间的位置。\n例如 2、3、3、4、18 的平均数是 6，中位数是 3。描述「多数人的典型水平」时，需要留意这个差别。','把 18 换成 100，平均数会从 6 变成 22.4，中位数仍然是 3。所以比较数据时，先看是否存在少数特别大或特别小的数，再选择合适指标。'],
['概率为 1/2，为什么连续十次不一定各出现五次？','概率描述的是一种长期趋势，不承诺每一小组试验都恰好按比例发生。公平硬币投十次，正面可以出现 3 次、5 次或 7 次。\n试验次数很多时，正面所占的比例通常更接近 1/2。','每一次投掷都重新开始，前一次的结果不会替下一次「补齐」。十次里恰好五次正面只是众多可能结果之一，概率为 1/2 并不等于每两次必须一正一反。'],
['英语的一般过去时和现在完成时有什么区别？','一般过去时关注过去发生的事情，常有明确的过去时间；现在完成时关注过去的事情对现在的影响或截至现在的经历。\nI lost my key yesterday. 说的是昨天丢了钥匙。I have lost my key. 往往强调现在找不到钥匙。','先问自己：是在交代「过去什么时候发生」，还是在强调「现在有什么结果」？明确的 yesterday 通常搭配一般过去时；现在完成时把过去和现在连接起来。'],
['写议论文时，论点和论据怎样配合？','论点是你要让读者接受的判断，论据是支撑这个判断的事实、例子或理由。两者之间还需要解释。\n例如提出「规律运动有助于保持精力」，引用相关例子后，要说明这些例子为何能支持这个结论。','可以按三步写：先说观点，再给证据，最后解释证据与观点的联系。如果删掉解释后读者需要自己猜，你就需要补一句「这说明……」来完成推理。'],
['计算机程序里的循环是怎么工作的？','循环是让一组步骤按条件重复执行。比如「从 1 数到 5」，每次输出当前数字，然后把数字加 1；当数字大于 5 时停止。\n设计循环时要检查起点、重复的操作以及停止条件。','手动模拟三轮就很容易看懂：开始 i=1，输出 1 后 i=2；再输出 2 后 i=3。每轮都在更新 i，最终到 6 时停止。若忘记更新，就可能一直循环。'],
['复习时怎样判断自己是真的理解了？','合上材料后，尝试用自己的话解释，并独立做一道稍有变化的题。能复述原句，可能只是记住了；能解释为什么这样做，并迁移到新题，才更接近理解。\n遇到卡住的步骤，把疑问写得具体一些：哪一步、哪个条件、为什么。','给自己三个小检查：不用术语能否解释；能否举一个自己的例子；条件改变后能否说出结果怎么变。答不出的那一步，就是下一次最值得追问的地方。']
];
function makeDemoBoard(){return{id:'demo-board',title:'12 道题，一起慢慢弄明白。',cards:demoLessons.map((item,index)=>({id:'card-'+(index+1),index:index+1,question:item[0],answer:item[1],followups:index===2?[{requestId:'demo-initial',question:'我不明白：为什么移项要变号？',answer:item[2]}]:[]}))}}
function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node}
function put(node,text){const value=String(text??'');if(node.textContent!==value)node.textContent=value}
function obj(v){return v&&typeof v==='object'&&!Array.isArray(v)}
function closedError(){return new Error('题卡已关闭。重新打开后可以检查原追问。')}
function assertViewActive(){if(tornDown)throw closedError()}
function teardownView(){
if(tornDown)return;
// Keep delivery and request IDs so reopening checks the same work instead of resending it.
try{persist()}catch(_){}
tornDown=true;standardReady=false;viewLifetime.abort();
clearTimeout(toastTimer);resizeObserver?.disconnect();if(resizeFrame)cancelAnimationFrame(resizeFrame);
for(const pending of rpcPending.values()){clearTimeout(pending.timer);pending.reject(closedError())}
rpcPending.clear();busy.clear();
}
function showBridgeError(error){
// A failed standard handshake must not label an already usable legacy bridge as broken.
if(tornDown||board&&typeof window.openai?.callTool==='function')return;
const message=/timeout|超时/i.test(error?.message??'')?'题卡连接超时，请重试。':'题卡连接失败：'+readableError(error);
put($('board-error'),message);$('board-error').hidden=false;
if(!board)put($('empty-copy'),'题卡未能完成连接，请重试。已保存的题目和解答仍可恢复。');
}
function restoreState(state){const data=state?.privateContent?.inlineQA??state?.inlineQA;if(!obj(data)||board&&data.boardId!==board.id)return;const next={...ui};for(const key of ['drafts','collapsed','composerOpen','quotes','failed','activeRequests'])if(obj(data[key]))next[key]={...data[key]};next.boardId=typeof data.boardId==='string'?data.boardId:null;next.filter=typeof data.filter==='string'?data.filter:'';for(const[id,request]of Object.entries(next.activeRequests??{})){if(!next.failed[id])next.failed[id]={...request,error:'上次追问仍待确认。请检查这次解答；不会重复发起已发送的追问。'}}next.activeRequests={};ui=next}
function persist(){if(tornDown)return;if(demoMode){try{sessionStorage.setItem('inline-qa-demo-ui',JSON.stringify(ui))}catch(_){}}else if(typeof window.openai?.setWidgetState==='function'){window.openai.setWidgetState({privateContent:{inlineQA:ui}})}}
function say(message){if(tornDown)return;put($('toast'),message);$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('toast').hidden=true},3500)}
function requestId(){return window.crypto?.randomUUID?.()??'qa-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function readableError(error){const message=typeof error==='string'?error:error?.message??error?.data?.message??'';if(/timeout|超时/i.test(message))return'这次追问等待超时。可检查同一次追问的解答进度。';return message?String(message).slice(0,350):'这次追问没有完成。请稍后检查或重试。'}
function unpack(result){if(result?.isError){const text=result.content?.filter(x=>x.type==='text').map(x=>x.text).join('\n');throw new Error(text||'这次追问没有完成。')}if(obj(result?.structuredContent))return result.structuredContent;for(const item of result?.content??[]){if(item.type!=='text')continue;try{const value=JSON.parse(item.text);if(obj(value)&&(obj(value.board)||typeof value.boardId==='string'||obj(value.status)))return value}catch(_){}}return result}
function normalizeBoard(value){
if(!obj(value)||typeof value.id!=='string'||!Array.isArray(value.cards))return null;
const ids=new Set();const cards=value.cards.filter(c=>obj(c)&&typeof c.id==='string'&&!ids.has(c.id)&&ids.add(c.id)).map((c,index)=>({id:c.id,index:Number.isFinite(c.index)?c.index:index+1,question:String(c.question??''),answer:String(c.answer??''),followups:Array.isArray(c.followups)?c.followups.filter(f=>obj(f)&&typeof f.requestId==='string').map(f=>({requestId:f.requestId,question:String(f.question??''),answer:String(f.answer??'')})):[]}));
return{id:value.id,title:String(value.title??'读到哪里，就问到哪里。'),cards}
}
function applyResult(result){
if(tornDown)return false;
const data=unpack(result);
if(data?.board){const incoming=normalizeBoard(data.board);if(!incoming||board&&incoming.id!==board.id)return false;
if(ui.boardId!==incoming.id)ui={boardId:incoming.id,drafts:{},collapsed:{},composerOpen:{},quotes:{},failed:{},activeRequests:{},filter:''};
if(board){for(const card of incoming.cards){const previous=board.cards.find(x=>x.id===card.id);for(const followup of previous?.followups??[])if(!card.followups.some(x=>x.requestId===followup.requestId))card.followups.push(followup)}}
board=incoming;renderBoard();refreshFromServer();return true}
if(data?.boardId===board?.id&&typeof data.cardId==='string'&&obj(data.followup)){const card=board.cards.find(x=>x.id===data.cardId),f=data.followup;if(!card||typeof f.requestId!=='string')return false;const existing=card.followups.find(x=>x.requestId===f.requestId),next={requestId:f.requestId,question:String(f.question??''),answer:String(f.answer??'')};if(existing)Object.assign(existing,next);else card.followups.push(next);renderCard(card);renderSummary();return true}
return false
}
